<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>森森天氣</title>

    <link rel="icon" type="image/png" href="./icon-v2.png">
    <link rel="apple-touch-icon" href="./icon-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --ac-green: #7DE1A9;
            --ac-bg-pattern: #8FD8AF;
            --ac-cream: #FFFEF2;
            --ac-yellow: #F9F195;
            --ac-brown: #796452;
            --ac-blue: #4FB5D9;
            --ac-dark: #58504A;
            --ac-card-border: #E6E0C8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: var(--ac-dark);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* ⭐ 下拉選單 pill */
        .location-select {
            background: var(--ac-yellow);
            color: var(--ac-brown);
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            transform: rotate(-2deg);
            border: 2px solid white;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.1);
            appearance: none;
            outline: none;
        }

        .location-select:focus {
            outline: none;
        }

        .update-pill {
            font-size: 0.8rem;
            color: white;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0);
            border-radius: 35px;
            padding: 30px 25px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            position: relative;
        }

        .hero-period {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ac-blue);
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }

        .hero-icon {
            font-size: 5rem;
            filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.1));
            animation: bounce 3s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-temp {
            font-size: 4.5rem;
            font-weight: 900;
            color: var(--ac-brown);
            line-height: 1;
        }

        .hero-desc {
            font-size: 1.5rem;
            color: #8A7B70;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #E0D8C0;
        }

        .advice-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 20px;
        }

        .advice-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .advice-text {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--ac-brown);
            margin: 5px 0;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--ac-dark);
            margin-bottom: 15px;
            margin-left: 10px;
            font-weight: 900;
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 140px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 25px;
            padding: 20px 15px;
            text-align: center;
            border: 3px solid white;
            flex-shrink: 0;
        }

        .mini-time {
            background: var(--ac-green);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .mini-icon {
            font-size: 2.5rem;
            margin: 5px 0;
        }

        .mini-temp {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--ac-dark);
        }

        .loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(125, 225, 169, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; animation: bounce 2s infinite;">☁️</div>
        <p style="color: white; font-weight: bold; margin-top: 20px;">正在觀測雲的流動...</p>
    </div>

    <!-- ⭐ 下拉式選單取代 location-pill -->
    <div class="status-bar">
        <select id="citySelect" class="location-select">
            <option value="基隆市">📍 基隆市</option>
            <option value="臺北市" selected>📍 臺北市</option>
            <option value="新北市">📍 新北市</option>
            <option value="桃園市">📍 桃園市</option>
        </select>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <div id="heroCard"></div>

        <h3 class="section-title">稍後預報</h3>
        <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
        let currentCity = "臺北市";

        function buildAPI() {
            return `https://weather-search.zeabur.app/api/weather?city=${currentCity}`;
        }

        const BG_MAP = {
            "早晨": "./sun.jpg",
            "中午": "./pngtree.jpg",
            "下午": "./scene.jpg",
            "晚上": "./vector.jpg",
            "深夜": "./16pic_8664273_b.jpg"
        };

        function getWeatherIcon(w) {
            if (!w) return "🌤️";
            if (w.includes("晴")) return "☀️";
            if (w.includes("多雲")) return "⛅";
            if (w.includes("陰")) return "☁️";
            if (w.includes("雨")) return "🌧️";
            if (w.includes("雷")) return "⛈️";
            return "🌤️";
        }

        function getAdvice(rain, maxT) {
            let rainIcon = "🌂";
            let rainText = "不用帶傘";
            if (parseInt(rain) > 30) {
                rainIcon = "☂️";
                rainText = "記得帶傘！";
            }

            let clothIcon = "👕";
            let clothText = "舒適穿搭";
            if (maxT >= 28) {
                clothIcon = "🎽";
                clothText = "短袖出發";
            } else if (maxT <= 20) {
                clothIcon = "🧥";
                clothText = "加件外套";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(start) {
            const hour = new Date(start).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function applyBackground(period) {
            document.body.style.backgroundImage = `url('${BG_MAP[period]}')`;
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            const period = getTimePeriod(current.startTime);
            applyBackground(period);

            const advice = getAdvice(current.rain, current.maxTemp);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById("heroCard").innerHTML = `
                <div class="hero-card">
                    <div class="hero-period">${period}</div>
                    <div class="hero-temp-container">
                        <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>
                    <div class="hero-desc">${current.weather}</div>

                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.7rem; color:#999">降雨率 ${current.rain}</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.7rem; color:#999">最高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            const scroll = document.getElementById("futureForecasts");
            scroll.innerHTML = "";

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);
                const fd = new Date(f.startTime);
                if (fd.getDate() !== todayDate) p = "明天" + p;

                scroll.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${p}</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧${f.rain}</div>
                    </div>
                `;
            });

            const now = new Date();
            const days = ["週日","週一","週二","週三","週四","週五","週六"];

            document.getElementById("updateTime").textContent =
                `${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
        }

        async function fetchWeather() {
            try {
                const url = buildAPI();

                const delayPromise = new Promise(r => setTimeout(r, 1000));
                const fetchPromise = fetch(url).then(res => res.json());
                const [_, json] = await Promise.all([delayPromise, fetchPromise]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("mainContent").style.display = "block";
                }
            } catch (e) {
                alert("天氣資料讀取失敗！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);

        /* ⭐ 下拉選單切換城市 */
        document.getElementById("citySelect").addEventListener("change", function () {
            currentCity = this.value;
            document.getElementById("loading").style.display = "flex";
            document.getElementById("mainContent").style.display = "none";
            fetchWeather();
        });
    </script>
</body>

</html>
